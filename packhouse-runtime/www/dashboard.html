<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pack House — Camera Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f1419;
      color: #e7ecf1;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid #2a3544;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    .hint { font-size: 0.85rem; color: #8b9cb3; flex: 1; min-width: 200px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select {
      background: #1e2a3a;
      color: #e7ecf1;
      border: 1px solid #3d4f66;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #2a3a50; }
    button.active { background: #2563eb; border-color: #3b82f6; }
    main { padding: 16px; }
    .viewer {
      position: relative;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a3544;
    }
    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.65);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
      z-index: 2;
    }
    .grid-hint {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #8b9cb3;
      max-width: 720px;
    }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <header>
    <h1>Pack House Cameras</h1>
    <span class="hint">One Eufy P2P stream at a time — rotates to avoid HomeBase conflicts.</span>
    <div class="controls">
      <label>
        Interval
        <select id="interval">
          <option value="15">15s</option>
          <option value="20" selected>20s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
      </label>
      <button type="button" id="prev">Previous</button>
      <button type="button" id="pause">Pause</button>
      <button type="button" id="next">Next</button>
    </div>
  </header>
  <main>
    <div class="viewer">
      <div class="label" id="camLabel">—</div>
      <iframe id="player" title="Live stream" allow="autoplay; fullscreen"></iframe>
    </div>
    <p class="grid-hint">
      Solo view: <code id="soloLink">—</code><br />
      Do not use the 4-up go2rtc grid on one HomeBase — only one camera receives P2P video at a time.
    </p>
  </main>
  <script>
    const GO2RTC = window.location.protocol === "file:"
      ? "http://localhost:1984"
      : (new URLSearchParams(location.search).get("go2rtc") || "http://localhost:1984");

    const CAMERAS = [
      { id: "first_drying_stage", label: "First Drying Stage" },
      { id: "sorting_1", label: "Sorting 1" },
      { id: "indoor_receiving", label: "Indoor Receiving" },
      { id: "second_wash_dipping", label: "Second Wash & Dipping" },
    ];

    let index = 0;
    let paused = false;
    let timer = null;

    const player = document.getElementById("player");
    const camLabel = document.getElementById("camLabel");
    const soloLink = document.getElementById("soloLink");
    const intervalSel = document.getElementById("interval");

    function streamUrl(src) {
      return `${GO2RTC}/stream.html?src=${encodeURIComponent(src)}&mode=webrtc,mse`;
    }

    function show(i) {
      index = (i + CAMERAS.length) % CAMERAS.length;
      const cam = CAMERAS[index];
      camLabel.textContent = cam.label;
      player.src = streamUrl(cam.id);
      const url = streamUrl(cam.id);
      soloLink.innerHTML = `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
      document.querySelectorAll("button[data-cam]").forEach((b) => {
        b.classList.toggle("active", b.dataset.cam === cam.id);
      });
    }

    function schedule() {
      if (timer) clearInterval(timer);
      if (paused) return;
      const sec = parseInt(intervalSel.value, 10) || 20;
      timer = setInterval(() => show(index + 1), sec * 1000);
    }

    document.getElementById("prev").onclick = () => { show(index - 1); schedule(); };
    document.getElementById("next").onclick = () => { show(index + 1); schedule(); };
    document.getElementById("pause").onclick = (e) => {
      paused = !paused;
      e.target.textContent = paused ? "Resume" : "Pause";
      schedule();
    };
    intervalSel.onchange = schedule;

    show(0);
    schedule();
  </script>
</body>
</html>
