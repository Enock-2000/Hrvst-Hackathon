# Pack house cameras — RTSP from go2rtc (repo root docker compose)
# Start bridge first: docker compose up -d  (or .\Start-PackHouse.ps1)

default_camera: second_wash_dipping

cameras:
  first_drying_stage:
    name: "First Drying Stage (Eufy T8170)"
    rtsp: "rtsp://127.0.0.1:8554/first_drying_stage"
    # Optional JPEG fallback (lower FPS): http://127.0.0.1:1984/api/frame.jpeg?src=first_drying_stage
    goals:
      - delivery_detection
      - license_plate
      - produce_crate

  sorting_1:
    name: "Sorting 1 (Eufy T8170)"
    rtsp: "rtsp://127.0.0.1:8554/sorting_1"
    goals:
      - delivery_detection
      - produce_crate
      - worker

  indoor_receiving:
    name: "Indoor Receiving (Eufy T8170)"
    rtsp: "rtsp://127.0.0.1:8554/indoor_receiving"
    goals:
      - delivery_detection
      - license_plate
      - worker

  second_wash_dipping:
    name: "Second Wash & Dipping (Eufy T8170)"
    rtsp: "rtsp://127.0.0.1:8554/second_wash_dipping"
    goals:
      - delivery_detection
      - license_plate
      - produce_crate

  outdoor_receiving:
    name: "Outdoor Receiving (Eufy T8170)"
    rtsp: "rtsp://127.0.0.1:8554/outdoor_receiving"
    goals:
      - delivery_detection
      - license_plate
      - produce_crate

  drying_dispatch:
    name: "Drying Dispatch (Eufy T8170)"
    rtsp: "rtsp://127.0.0.1:8554/drying_dispatch"
    goals:
      - delivery_detection
      - produce_crate
      - worker

  entrance:
    name: "Entrance (Eufy T8172)"
    rtsp: "rtsp://127.0.0.1:8554/entrance"
    goals:
      - delivery_detection
      - license_plate
      - produce_crate

