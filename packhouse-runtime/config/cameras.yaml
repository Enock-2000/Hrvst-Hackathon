# Pack house cameras — go2rtc RTSP (repo root docker compose + stream coordinator)
# Eufy HomeBase: one P2P livestream at a time — use one camera per detection session,
# or the rotating dashboard: http://localhost:8080/dashboard.html

default_camera: second_wash_dipping

cameras:
  first_drying_stage:
    name: "First Drying Stage (Eufy T8170)"
    go2rtc_src: first_drying_stage
    rtsp: "rtsp://127.0.0.1:8554/first_drying_stage"
    http: "http://127.0.0.1:1984/api/stream.mjpeg?src=first_drying_stage"

  sorting_1:
    name: "Sorting 1 (Eufy T8170)"
    go2rtc_src: sorting_1
    rtsp: "rtsp://127.0.0.1:8554/sorting_1"
    http: "http://127.0.0.1:1984/api/stream.mjpeg?src=sorting_1"

  indoor_receiving:
    name: "Indoor Receiving (Eufy T8170)"
    go2rtc_src: indoor_receiving
    rtsp: "rtsp://127.0.0.1:8554/indoor_receiving"
    http: "http://127.0.0.1:1984/api/stream.mjpeg?src=indoor_receiving"

  second_wash_dipping:
    name: "Second Wash & Dipping (Eufy T8170)"
    go2rtc_src: second_wash_dipping
    rtsp: "rtsp://127.0.0.1:8554/second_wash_dipping"
    http: "http://127.0.0.1:1984/api/stream.mjpeg?src=second_wash_dipping"
