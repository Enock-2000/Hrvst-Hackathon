# =============================================================================
# Pack House YOLO — Model class ID → readable names
# =============================================================================
# Maps the 19 classes in packhouse_best.pt (training layout) to human-readable
# labels for live inference, reports, and dashboards.
#
# IDs 0–7: core pack-house goals (already named in training)
# IDs 8–18: per-produce classes from merged Roboflow freshness datasets
#           (inferred from label filenames; see notes per class)
#
# =============================================================================

nc: 19

