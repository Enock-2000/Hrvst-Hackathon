services:
  eufy-security-ws:
    image: bropat/eufy-security-ws:latest
    container_name: eufy-security-ws
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - USERNAME=${EUFY_USERNAME}
      - PASSWORD=${EUFY_PASSWORD}
      - COUNTRY=${EUFY_COUNTRY:-US}
      - TRUSTED_DEVICE_NAME=eufyBridge
      - WS_LISTEN_PORT=3000
    volumes:
      - ./eufy-data:/data

  # Living room / entrance (from devices.json)
  eufyp2pstream:
    build: ./bridge
    container_name: eufyp2pstream
    restart: unless-stopped
    environment:
      - EUFY_WS_HOST=eufy-security-ws
      - EUFY_WS_PORT=3000
      - EUFY_DEVICE_SERIAL=T8170T1026063339
      - EUFY_VIDEO_PORT=63336
      - EUFY_AUDIO_PORT=63337
      - EUFY_BACKCHANNEL_PORT=63338
    depends_on:
      - eufy-security-ws

  # Garage camera — one eufyp2pstream container per camera
  eufyp2pstream_garage:
    build: ./bridge
    container_name: eufyp2pstream_garage
    restart: unless-stopped
    environment:
      - EUFY_WS_HOST=eufy-security-ws
      - EUFY_WS_PORT=3000
      - EUFY_DEVICE_SERIAL=T8170T10250241C5
      - EUFY_VIDEO_PORT=63346
      - EUFY_AUDIO_PORT=63347
      - EUFY_BACKCHANNEL_PORT=63348
    depends_on:
      - eufy-security-ws

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"   # web UI / HTTP API / MSE / HLS
      - "8554:8554"   # RTSP
      - "8555:8555/tcp"   # WebRTC TCP
      - "8555:8555/udp"   # WebRTC UDP
    volumes:
      - ./go2rtc-config:/config
    depends_on:
      - eufyp2pstream
      - eufyp2pstream_garage
